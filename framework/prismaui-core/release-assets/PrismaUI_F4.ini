; PrismaUI_F4 configuration.
;
; FO4VR prerequisite: install the official VR Address Library (Nexus mod 64879) 1.14.0 or newer as
; Data/F4SE/plugins/version-1-2-72-0.csv. PrismaUI does not ship that file; remove any copy an older
; PrismaUI VR package installed so the mod manager keeps the official one.
; Dependency: source:docs/code-notes/prismaui-core.md.

[Debug]
; Map each view's Ultralight texture and its stable copy every 120 frames and log pixel statistics. This
; is a real per-view GPU readback on the render thread and WILL cost frames -- only for diagnosing
; an on-mesh screen that renders black.
; 0 = off (default). 1 = on.
TextureProbe=0

; 0 = disable BindViewToGeometry/BindViewToScreenTexture (terminal + Pip-Boy screens render
; vanilla instead). Useful for isolating whether an issue is caused by mesh binding.
bMeshBinding=0

; When the freeze-diagnostics watchdog decides the game has hard-frozen, write a Windows minidump
; (all thread stacks) to Data\F4SE\Plugins\PrismaUI_F4\FreezeDumps\ for WinDbg analysis. The
; structured [FREEZE] log block is always written regardless of this setting.
; 1 = write a dump per freeze episode (default). 0 = log only, no dump.
FreezeMinidump=1

[Diagnostics]
; MAP76 compatibility probe. Logs throttled Fallout mouse/cursor events plus correlated MenuCursor and
; Pip-Boy cursor ownership state without changing normal Prisma focus/cursor behavior.
; 0 = off (default). 1 = log [MAP76-CURSOR] samples.
bMap76Cursor=0

[GPU]
; 0 = CPU rendering. 1 = GPU rendering (default).
; GPU rendering is on by default, including where ENB owns the D3D11 device. The allowance is not ENB-only:
; any coherent d3d11.dll proxy (ReShade, Special K, DXVK-style wrappers, ENB) is accepted. Not yet validated in game.
; If the GPU path fails to start, PrismaUI falls back to CPU rendering. A GPU drain failure at runtime, other
; than device removed or reset, stops all Prisma UI for the rest of the session with no CPU switch. An access
; violation that the drain guard does not catch still crashes the game.
; Known risk: a crash inside the GPU path under a proxied device has not been reproduced and fixed (#674).
; Set to 0 to force CPU rendering without a rebuild.
bAcceleratedRendering=1

[DevTools]
; DevTools are disabled by default. When enabled, PrismaUI opens the local Ultralight inspector
; in-game. Press F12 while a PrismaUI view is visible to toggle it.
bEnabled=0
; Retained for configuration compatibility. The local inspector does not open a TCP listener.
iPort=9222

[MeshBinding]
; 1 = keep mesh-bound screens full-bright, ignoring cell lighting (needed for a Pip-Boy/PDA-style
; screen replacement). 0 = scene-lit (darkens in unlit cells). If it tints the web content, set
; back to 0.
bScreenSelfIlluminate=1

[Controller]
Style=playstation

[Perf]
; Skip the fullscreen composite on frames where Prisma has nothing on screen -- no focused view,
; no dock, no model/texture overlays, no cursor, and the shell reports no visible content. On such
; a frame the composite blits a fully transparent surface over the backbuffer, which cannot change
; a pixel, so the whole pass (a full D3D11 state snapshot plus the draw) is pure cost. It also
; skips the per-frame model-preview tick and overlay collection that fed it.
;
; Off by default because it is new; any uncertainty falls through to compositing exactly as before.
; 0 = always composite (default). 1 = skip idle frames.
SkipIdleComposite=0

; Periodic [PrismaPerf] report: per-stage CPU and GPU timings for the Present path. Costs GPU
; timestamp queries every frame while on -- diagnostic use, not something to leave enabled.
; 0 = off (default). 1 = on.
Profiler=0

; Seconds between [PrismaPerf] reports when Profiler=1.
ReportSeconds=5

[Compatibility]
; Suppress the startup warning about GPU overlay software (RivaTuner/MSI Afterburner and friends).
; Those hook the same Present that Prisma does; the warning exists because they are a common cause
; of a black or missing UI. Setting this to 1 acknowledges the risk and stops the dialog.
; 0 = warn (default). 1 = do not warn.
bAllowOverlays=0

; How the compositor treats the backbuffer it draws into. Leave at 0 unless a Frame Generation or
; ENB setup is producing a black/flickering UI and you have been asked to change it.
; 0 = automatic (default).
iBackbufferOwnership=0

[Network]
; Logs [NetworkAudit] lines to PrismaUI_F4.log: file loads allowed or denied, top-level navigations,
; and CSP refusals reported by WebKit. Paths and navigation URLs drop query strings; CSP lines
; repeat WebKit's message as-is. Noisy. Not a socket logger.
; 0 = off (default). 1 = on.
bLogNetworkRequests=0

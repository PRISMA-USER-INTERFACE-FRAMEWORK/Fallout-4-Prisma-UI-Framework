<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>PrismaUI_F4 Shell</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      /* Production shell: an empty container. Plugin views are added as iframes by the native
     view-manager (window.__prismaShell), NOT hardcoded here. The Phase 3 debug views + overlay only
     appear when the shell is opened with ?debug=1. */
      #views {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* pointer-events:none by default -- a view is a full-screen iframe regardless of how much of it is
     visually occupied by its own content (e.g. a small corner HUD widget), so an always-shown,
     never-focused view (Health, Radiation, Compass, ...) would otherwise silently swallow clicks meant
     for anything underneath it, screen-wide. Re-enabled only for the currently-focused view by
     focusView()/unfocusView() below -- mirrors dock.html's own opacity+pointer-events toggle pattern,
     just applied at the shell level instead of within a single page. */
      iframe.prisma-view {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: none;
        background: transparent;
        pointer-events: none;
      }
      /* Framework-owned system views (boot animation, dock) sit above plugin views. */
      iframe.prisma-system {
        position: absolute;
        border: none;
        background: transparent;
        z-index: 100000;
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="views"></div>
  </body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: center; }
  .boot {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 12px 20px 12px 14px;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
    /* Dark rounded backing so the text is readable over ANY in-game background (was hard to read on
       light scenes when relying on text-shadow alone). Subtle blur + brand-tinted border for polish. */
    background: rgba(16, 8, 24, 0.78);
    border: 1px solid rgba(200, 120, 255, 0.35);
    border-radius: 16px;
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(4px);
    /* Slide/fade in, HOLD long enough to read, then fade out. Total ~7s, matched to the shell's
       7000ms teardown (window.__prismaShell.showBootAnimation). */
    animation: bootIn 0.6s ease-out both, bootOut 0.9s ease-in 6.1s both;
  }
  .logo {
    width: 60px;
    height: 60px;
    filter: drop-shadow(0 0 10px rgba(200, 80, 255, 0.7));
    animation: spinPop 0.7s cubic-bezier(0.2, 0.9, 0.3, 1.3) both;
  }
  .text { line-height: 1.25; }
  .title {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  }
  .sub {
    font-size: 12px;
    color: #e6c8ff;
    letter-spacing: 0.5px;
    opacity: 0.92;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
  }
  @keyframes bootIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
  @keyframes bootOut { from { opacity: 1; } to { opacity: 0; transform: translateX(20px); } }
  @keyframes spinPop { from { opacity: 0; transform: rotate(-30deg) scale(0.4); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="boot">
    <img class="logo" src="../logo.png" alt="">
    <div class="text">
      <div class="title">Prisma Loaded</div>
      <div class="sub">framework &amp; shell ready</div>
    </div>
  </div>
</body>
</html>
